[project]
name = "fleet"
version = "0.1.0"
description = "Private 24/7 watcher fleet: one engine, watchers as rows, alerts via ntfy, managed over MCP"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.2",
]

[project.scripts]
fleet-worker = "fleet.worker:main"
fleet-mcp = "fleet.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
