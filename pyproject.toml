[project]
name = "fleet"
version = "0.4.0"
description = "Private 24/7 watcher fleet: one engine, watchers as rows, alerts via ntfy, managed over MCP"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.2",
    "cronsim>=2.6",
]

[project.scripts]
fleet-worker = "fleet.worker:main"
fleet-mcp = "fleet.mcp_server:main"
fleetctl = "fleet.fleetctl:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
# 110 matches how this codebase is actually written; the point is catching
# runaway lines, not reflowing working code.
line-length = 110

[tool.ruff.lint]
# E/W/F: real errors and dead code. I: import order. B: bugbear (mutable
# defaults, loop-variable capture). UP: py3.12+ idioms. Deliberately no
# formatter and no C4/SIM — those force churn without catching bugs.
select = ["E", "F", "W", "I", "B", "UP"]
